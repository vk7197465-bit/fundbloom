
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>FundBloom | Sign Up</title>

<link rel="icon" type="image/png" href="images/l.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>


<style>

/* =========================================================
   FUNDBLOOM SIGNUP
   SAME SYSTEM AS INDEX + LOGIN
========================================================= */

:root{

    --primary:#5B5CE2;
    --secondary:#F4A261;

    --bg:#F8F8FC;
    --surface:#FFFFFF;
    --surface-2:#F1F1F8;

    --text:#17172A;
    --muted:#707083;

    --border:rgba(23,23,42,.09);

    --heading:"Playfair Display",serif;
    --body:"DM Sans",sans-serif;

    --danger:#D9534F;

    --shadow:
        0 24px 70px rgba(23,23,42,.10);

}


/* =========================================================
   DARK THEME
========================================================= */

body.dark-theme{

    --bg:#10111E;
    --surface:#17182A;
    --surface-2:#202136;

    --text:#F5F5FA;
    --muted:#A8A8BA;

    --border:rgba(255,255,255,.09);

    --shadow:
        0 24px 70px rgba(0,0,0,.40);

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

}


body{

    min-height:100dvh;

    font-family:var(--body);

    color:var(--text);

    background:

        radial-gradient(
            circle at 5% 8%,
            rgba(91,92,226,.13),
            transparent 28%
        ),

        radial-gradient(
            circle at 95% 92%,
            rgba(244,162,97,.12),
            transparent 28%
        ),

        var(--bg);

    transition:
        background .3s ease,
        color .3s ease;

}


button,
input{

    font:inherit;

}


button{

    -webkit-tap-highlight-color:transparent;

}


/* =========================================================
   PAGE
========================================================= */

.fb-signup-page{

    width:100%;
    height:100dvh;

    min-height:500px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:14px;

    overflow:hidden;

    position:relative;

}


/* =========================================================
   DECORATIVE ORBITS
========================================================= */

.fb-signup-page::before{

    content:"";

    position:absolute;

    width:440px;
    height:440px;

    border:1px solid
        rgba(91,92,226,.09);

    border-radius:50%;

    top:-300px;
    left:-210px;

    pointer-events:none;

}


.fb-signup-page::after{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border:1px solid
        rgba(244,162,97,.09);

    border-radius:50%;

    right:-240px;
    bottom:-260px;

    pointer-events:none;

}


html[dir="rtl"] .fb-signup-page::before{

    left:auto;
    right:-210px;

}


html[dir="rtl"] .fb-signup-page::after{

    right:auto;
    left:-240px;

}


/* =========================================================
   TOP CONTROLS
========================================================= */

.fb-auth-controls{

    position:fixed;

    top:15px;
    right:17px;

    display:flex;

    align-items:center;

    gap:7px;

    z-index:50;

}


html[dir="rtl"] .fb-auth-controls{

    right:auto;
    left:17px;

}


.fb-auth-control{

    width:37px;
    height:37px;

    border:1px solid var(--border);

    border-radius:11px;

    background:var(--surface);

    color:var(--muted);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(20,22,50,.07);

    transition:
        color .2s ease,
        border-color .2s ease,
        transform .2s ease,
        background .2s ease;

}


.fb-auth-control:hover{

    color:var(--primary);

    border-color:
        rgba(91,92,226,.38);

    transform:translateY(-1px);

}


.fb-auth-control:active{

    transform:translateY(0);

}


.fb-auth-control svg{

    width:16px;
    height:16px;

    stroke-width:2;

}


/* =========================================================
   SIGNUP CARD
========================================================= */

.fb-signup-card{

    width:min(100%,450px);

    max-height:90dvh;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:25px;

    box-shadow:var(--shadow);

    padding:21px 30px 17px;

    position:relative;

    z-index:5;

    overflow:hidden;

    transition:
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

}


/* =========================================================
   CARD ACCENT
========================================================= */

.fb-signup-card::before{

    content:"";

    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:75px;
    height:3px;

    border-radius:
        0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

}


html[dir="rtl"] .fb-signup-card::before{

    left:50%;

}


/* =========================================================
   BRAND
========================================================= */

.fb-auth-brand{

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:10px;

}


.fb-brand{

    display:flex;

    align-items:center;

    gap:3px;

    flex-shrink:0;

    text-decoration:none;

}


.fb-logo-image{

    width:42px;
    height:42px;

    object-fit:contain;

    background:transparent;

}


.fb-brand-text{

    display:flex;

    flex-direction:column;

    line-height:1;

}


.fb-brand-name{

    font-size:25px;

    font-weight:600;

    letter-spacing:-.8px;

    white-space:nowrap;

}


.fb-brand-primary{

    color:var(--primary);

}


.fb-brand-secondary{

    color:var(--secondary);

}


.fb-brand-tagline{

    margin-top:5px;

    font-size:8px;

    font-weight:600;

    letter-spacing:1.55px;

    color:var(--muted);

    white-space:nowrap;

}


/* =========================================================
   HEADING
========================================================= */

.fb-signup-heading{

    text-align:center;

    margin-bottom:12px;

}


.fb-signup-eyebrow{

    display:inline-flex;

    align-items:center;

    gap:6px;

    color:var(--primary);

    font-size:9px;

    font-weight:600;

    letter-spacing:1.5px;

    margin-bottom:4px;

}


.fb-signup-eyebrow::before,
.fb-signup-eyebrow::after{

    content:"";

    width:14px;
    height:1px;

    background:var(--primary);

}


.fb-signup-heading h1{

    font-family:var(--heading);

    font-size:25px;

    line-height:1.1;

    letter-spacing:-.4px;

    margin-bottom:4px;

}


.fb-signup-heading p{

    color:var(--muted);

    font-size:12px;

    line-height:1.45;

}


/* =========================================================
   FORM
========================================================= */

.fb-signup-form{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:8px;

}


.fb-field{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:3px;

}


.fb-field label{

    font-size:11px;

    font-weight:600;

    color:var(--text);

}


/* =========================================================
   INPUT
========================================================= */

.fb-input-wrap{

    width:100%;

    position:relative;

}


.fb-input{

    width:100%;

    height:35px;

    border:1px solid var(--border);

    border-radius:9px;

    outline:none;

    background:var(--surface-2);

    color:var(--text);

    padding:
        0 11px;

    font-size:11px;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;

}


.fb-input::placeholder{

    color:var(--muted);

    opacity:.75;

}


.fb-input:focus{

    background:var(--surface);

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(91,92,226,.075);

}


.fb-password-input{

    padding-right:38px;

}


html[dir="rtl"] .fb-password-input{

    padding-right:11px;
    padding-left:38px;

}


/* =========================================================
   PASSWORD BUTTON
========================================================= */

.fb-password-toggle{

    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:24px;
    height:24px;

    border:0;

    background:transparent;

    color:var(--muted);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

}


html[dir="rtl"] .fb-password-toggle{

    right:auto;
    left:7px;

}


.fb-password-toggle:hover{

    color:var(--primary);

}


.fb-password-toggle svg{

    width:13px;
    height:13px;

}


/* =========================================================
   TERMS
========================================================= */

.fb-terms{

    display:flex;

    align-items:flex-start;

    gap:5px;

    margin-top:3px;

    color:var(--muted);

    font-size:10px;

    line-height:1.4;

    cursor:pointer;

}


.fb-terms input{

    width:11px;
    height:11px;

    flex-shrink:0;

    margin-top:1px;

    accent-color:var(--primary);

}


.fb-terms a{

    color:var(--primary);

    font-weight:700;

    text-decoration:none;

}


.fb-terms a:hover{

    text-decoration:underline;

}


/* =========================================================
   CREATE ACCOUNT
========================================================= */

.fb-signup-btn{

    width:100%;
    height:37px;

    border:0;

    border-radius:9px;

    background:
        linear-gradient(
            110deg,
            var(--primary),
            #7677E9
        );

    color:#fff;

    font-size:10px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 9px 20px
        rgba(91,92,226,.20);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


.fb-signup-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 12px 24px
        rgba(91,92,226,.27);

}


.fb-signup-btn:active{

    transform:translateY(0);

}


/* =========================================================
   DIVIDER
========================================================= */

.fb-divider{

    display:flex;

    align-items:center;

    gap:8px;

    margin:9px 0 7px;

}


.fb-divider span{

    flex:1;

    height:1px;

    background:var(--border);

}


.fb-divider p{

    font-size:8px;

    color:var(--muted);

    letter-spacing:.6px;

    white-space:nowrap;

}


/* =========================================================
   SOCIAL
========================================================= */

.fb-social-grid{

    width:100%;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

}


.fb-social-btn{

    width:100%;
    height:33px;

    border:1px solid var(--border);

    border-radius:9px;

    background:var(--surface);

    color:var(--text);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    font-size:8px;

    font-weight:600;

    cursor:pointer;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;

}


.fb-social-btn:hover{

    background:var(--surface-2);

    border-color:
        rgba(91,92,226,.32);

    transform:translateY(-1px);

}


.fb-social-btn svg{

    width:14px;
    height:14px;

    flex-shrink:0;

}


.fb-apple-logo{

    width:14px !important;
    height:16px !important;

}


/* =========================================================
   BOTTOM LOGIN LINK
========================================================= */

.fb-auth-footer{

    border-top:1px solid var(--border);

    margin-top:9px;

    padding-top:8px;

    text-align:center;

    color:var(--muted);

    font-size:10px;

}


.fb-auth-footer a{

    color:var(--primary);

    font-size:10px;

    font-weight:600;

    text-decoration:none;

}


.fb-auth-footer a:hover{

    text-decoration:underline;

}


/* =========================================================
   SAMSUNG S8
========================================================= */

@media(max-width:380px){

    .fb-signup-page{

        padding:7px 8px;

    }


    .fb-auth-controls{

        top:8px;
        right:8px;

    }


    html[dir="rtl"] .fb-auth-controls{

        right:auto;
        left:8px;

    }


    .fb-auth-control{

        width:32px;
        height:32px;

        border-radius:9px;

    }


    .fb-auth-control svg{

        width:14px;
        height:14px;

    }


    .fb-signup-card{

        width:100%;

        max-width:344px;

        max-height:
            calc(100dvh - 14px);

        padding:
            15px 15px 11px;

        border-radius:19px;

    }


    .fb-auth-brand{

        margin-bottom:6px;

    }


    .fb-logo-image{

        width:35px;
        height:35px;

    }


    .fb-brand-name{

        font-size:21px;

    }


    .fb-brand-tagline{

        margin-top:4px;

        font-size:6px;

        letter-spacing:1.25px;

    }


    .fb-signup-heading{

        margin-bottom:8px;

    }


    .fb-signup-eyebrow{

        font-size:6px;

        margin-bottom:3px;

    }


    .fb-signup-eyebrow::before,
    .fb-signup-eyebrow::after{

        width:11px;

    }


    .fb-signup-heading h1{

        font-size:21px;

        margin-bottom:3px;

    }


    .fb-signup-heading p{

        font-size:7px;

    }


    .fb-signup-form{

        gap:5px;

    }


    .fb-field{

        gap:2px;

    }


    .fb-field label{

        font-size:7px;

    }


    .fb-input{

        height:31px;

        border-radius:7px;

        font-size:8px;

        padding-left:9px;
        padding-right:9px;

    }


    .fb-password-input{

        padding-right:34px;

    }


    html[dir="rtl"] .fb-password-input{

        padding-right:9px;
        padding-left:34px;

    }


    .fb-password-toggle{

        right:5px;

        width:22px;
        height:22px;

    }


    html[dir="rtl"] .fb-password-toggle{

        right:auto;
        left:5px;

    }


    .fb-password-toggle svg{

        width:12px;
        height:12px;

    }


    .fb-terms{

        font-size:6px;

        gap:4px;

    }


    .fb-terms input{

        width:9px;
        height:9px;

    }


    .fb-signup-btn{

        height:33px;

        border-radius:8px;

        font-size:8px;

    }


    .fb-divider{

        margin:
            6px 0 5px;

        gap:6px;

    }


    .fb-divider p{

        font-size:5.5px;

    }


    .fb-social-grid{

        gap:6px;

    }


    .fb-social-btn{

        height:29px;

        border-radius:7px;

        font-size:7px;

    }


    .fb-social-btn svg{

        width:12px;
        height:12px;

    }


    .fb-apple-logo{

        width:12px !important;
        height:14px !important;

    }


    .fb-auth-footer{

        margin-top:6px;

        padding-top:6px;

        font-size:6px;

    }


    .fb-auth-footer a{

        font-size:6px;

    }

}


/* =========================================================
   SHORT SCREENS
========================================================= */

@media(max-height:650px){

    .fb-signup-card{

        padding-top:12px;
        padding-bottom:9px;

    }


    .fb-auth-brand{

        margin-bottom:5px;

    }


    .fb-signup-heading{

        margin-bottom:6px;

    }


    .fb-signup-form{

        gap:4px;

    }


    .fb-field{

        gap:2px;

    }


    .fb-input{

        height:30px;

    }


    .fb-signup-btn{

        height:32px;

    }


    .fb-divider{

        margin-top:5px;
        margin-bottom:4px;

    }


    .fb-auth-footer{

        margin-top:5px;

        padding-top:5px;

    }

}


/* =========================================================
   VERY SHORT DEVICES
========================================================= */

@media(max-height:570px){

    .fb-signup-card{

        padding-top:9px;
        padding-bottom:7px;

    }


    .fb-logo-image{

        width:30px;
        height:30px;

    }


    .fb-brand-name{

        font-size:19px;

    }


    .fb-brand-tagline{

        font-size:5px;

    }


    .fb-signup-heading h1{

        font-size:19px;

    }


    .fb-signup-heading p{

        display:none;

    }


    .fb-input{

        height:27px;

    }


    .fb-signup-btn{

        height:29px;

    }


    .fb-social-btn{

        height:27px;

    }

}

</style>

</head>


<body>


<main class="fb-signup-page">


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <div class="fb-auth-controls">


        <button
            type="button"
            class="fb-auth-control"
            id="rtlToggle"
            aria-label="Toggle direction">

            <i data-lucide="arrow-left-right"></i>

        </button>


        <button
            type="button"
            class="fb-auth-control"
            id="themeToggle"
            aria-label="Toggle theme">

            <i data-lucide="moon"></i>

        </button>


    </div>



    <!-- =====================================================
         SIGNUP CARD
    ====================================================== -->

    <section class="fb-signup-card">


        <!-- BRAND -->

        <div class="fb-auth-brand">

            <a
                href="index.html"
                class="fb-brand">


                <img
                    src="images/l.png"
                    alt="FundBloom Logo"
                    class="fb-logo-image">


                <span class="fb-brand-text">


                    <span class="fb-brand-name">

                        <span class="fb-brand-primary">
                            Fund
                        </span>

                        <span class="fb-brand-secondary">
                            Bloom
                        </span>

                    </span>


                    <span class="fb-brand-tagline">
                        SCHOOL FUNDRAISING
                    </span>


                </span>


            </a>

        </div>



        <!-- HEADING -->

        <div class="fb-signup-heading">


            <div class="fb-signup-eyebrow">
                CREATE ACCOUNT
            </div>


            <h1>
                Join FundBloom
            </h1>


            <p>
                Create your account and start managing
                your school fundraising journey.
            </p>


        </div>



        <!-- FORM -->

        <form
            class="fb-signup-form"
            id="signupForm">


            <!-- FIRST NAME -->

            <div class="fb-field">

                <label for="firstName">
                    First Name
                </label>

                <input
                    class="fb-input"
                    id="firstName"
                    name="firstName"
                    type="text"
                    placeholder="Enter your first name"
                    autocomplete="given-name"
                    required>

            </div>



            <!-- LAST NAME -->

            <div class="fb-field">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    class="fb-input"
                    id="lastName"
                    name="lastName"
                    type="text"
                    placeholder="Enter your last name"
                    autocomplete="family-name"
                    required>

            </div>



            <!-- EMAIL -->

            <div class="fb-field">

                <label for="signupEmail">
                    Email Address
                </label>

                <input
                    class="fb-input"
                    id="signupEmail"
                    name="email"
                    type="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required>

            </div>



            <!-- PASSWORD -->

            <div class="fb-field">

                <label for="signupPassword">
                    Password
                </label>


                <div class="fb-input-wrap">


                    <input
                        class="fb-input fb-password-input"
                        id="signupPassword"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required>


                    <button
                        type="button"
                        class="fb-password-toggle"
                        data-password="signupPassword"
                        aria-label="Show password">


                        <i data-lucide="eye"></i>


                    </button>


                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="fb-field">

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="fb-input-wrap">


                    <input
                        class="fb-input fb-password-input"
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required>


                    <button
                        type="button"
                        class="fb-password-toggle"
                        data-password="confirmPassword"
                        aria-label="Show password">


                        <i data-lucide="eye"></i>


                    </button>


                </div>

            </div>



            <!-- TERMS -->

            <label class="fb-terms">


                <input
                    type="checkbox"
                    id="terms"
                    required>


                <span>

                    I agree to the

                    <a href="#">
                        Terms
                    </a>

                    and

                    <a href="#">
                        Privacy Policy
                    </a>.

                </span>


            </label>



            <!-- CREATE ACCOUNT -->

            <button
                type="submit"
                class="fb-signup-btn">

                Create Account

            </button>


        </form>



        <!-- DIVIDER -->

        <div class="fb-divider">


            <span></span>


            <p>
                OR SIGN UP WITH
            </p>


            <span></span>


        </div>



        <!-- SOCIAL -->

        <div class="fb-social-grid">


            <!-- GOOGLE -->

            <button
                type="button"
                class="fb-social-btn"
                aria-label="Continue with Google">


                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true">


                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.42z"/>


                    <path
                        fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.74 9.74 0 0 0 12 21.5z"/>


                    <path
                        fill="#FBBC05"
                        d="M6.53 13.58A5.86 5.86 0 0 1 6.22 12c0-.55.1-1.08.31-1.58V7.89H3.29A9.5 9.5 0 0 0 2.25 12c0 1.48.35 2.88 1.04 4.11l3.24-2.53z"/>


                    <path
                        fill="#EA4335"
                        d="M12 6.39c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.83 3.48 14.62 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.39l3.24 2.53C7.3 8.11 9.46 6.39 12 6.39z"/>


                </svg>


                Google


            </button>



            <!-- APPLE -->

            <button
                type="button"
                class="fb-social-btn"
                aria-label="Continue with Apple">


                <svg
                    class="fb-apple-logo"
                    viewBox="0 0 24 24"
                    aria-hidden="true">


                    <path
                        fill="currentColor"
                        d="M17.05 12.67c-.02-2.14 1.75-3.17 1.83-3.22a3.94 3.94 0 0 0-3.1-1.68c-1.3-.14-2.54.77-3.2.77-.67 0-1.7-.75-2.8-.73a4.13 4.13 0 0 0-3.47 2.12c-1.5 2.6-.38 6.44 1.06 8.55.71 1.03 1.55 2.18 2.66 2.14 1.07-.04 1.48-.69 2.78-.69 1.29 0 1.66.69 2.79.67 1.16-.02 1.9-1.05 2.61-2.09a8.5 8.5 0 0 0 1.19-2.42 3.75 3.75 0 0 1-2.35-3.42zM14.95 6.4a3.73 3.73 0 0 0 .85-2.7 3.84 3.84 0 0 0-2.46 1.27 3.57 3.57 0 0 0-.88 2.6 3.18 3.18 0 0 0 2.49-1.17z"/>


                </svg>


                Apple


            </button>


        </div>



        <!-- LOGIN -->

        <div class="fb-auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </section>

</main>



<script>

(function(){

    "use strict";


    /* =========================================================
       INITIALIZE LUCIDE
    ========================================================= */

    if(window.lucide){

        lucide.createIcons();

    }


    /* =========================================================
       SHARED FUNDBLOOM SETTINGS
       SAME AS INDEX + LOGIN
    ========================================================= */

    const THEME_KEY =
        "fundBloomTheme";


    const DIRECTION_KEY =
        "fundBloomDirection";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const themeToggle =
        document.getElementById(
            "themeToggle"
        );


    const rtlToggle =
        document.getElementById(
            "rtlToggle"
        );


    /* =========================================================
       APPLY THEME
    ========================================================= */

    function applyTheme(theme){

        if(
            theme !== "dark" &&
            theme !== "light"
        ){

            theme = "light";

        }


        if(theme === "dark"){

            document.body.classList.add(
                "dark-theme"
            );

        }else{

            document.body.classList.remove(
                "dark-theme"
            );

        }


        localStorage.setItem(
            THEME_KEY,
            theme
        );


        updateThemeIcon();

    }


    /* =========================================================
       UPDATE THEME ICON
    ========================================================= */

    function updateThemeIcon(){

        if(!themeToggle){

            return;

        }


        const isDark =
            document.body.classList.contains(
                "dark-theme"
            );


        themeToggle.innerHTML =
            isDark

                ? '<i data-lucide="sun"></i>'

                : '<i data-lucide="moon"></i>';


        if(window.lucide){

            lucide.createIcons();

        }

    }


    /* =========================================================
       LOAD SAVED THEME
    ========================================================= */

    const savedTheme =
        localStorage.getItem(
            THEME_KEY
        ) || "light";


    applyTheme(savedTheme);


    /* =========================================================
       THEME BUTTON
    ========================================================= */

    if(themeToggle){

        themeToggle.addEventListener(
            "click",
            function(){

                const isDark =
                    document.body.classList.contains(
                        "dark-theme"
                    );


                const nextTheme =
                    isDark
                        ? "light"
                        : "dark";


                applyTheme(
                    nextTheme
                );

            }
        );

    }


    /* =========================================================
       APPLY RTL / LTR
    ========================================================= */

    function applyDirection(direction){

        if(
            direction !== "rtl" &&
            direction !== "ltr"
        ){

            direction = "ltr";

        }


        document.documentElement.dir =
            direction;


        document.documentElement.setAttribute(
            "data-direction",
            direction
        );


        localStorage.setItem(
            DIRECTION_KEY,
            direction
        );


        if(window.lucide){

            lucide.createIcons();

        }

    }


    /* =========================================================
       LOAD SAVED DIRECTION
    ========================================================= */

    const savedDirection =
        localStorage.getItem(
            DIRECTION_KEY
        ) || "ltr";


    applyDirection(
        savedDirection
    );


    /* =========================================================
       RTL BUTTON
    ========================================================= */

    if(rtlToggle){

        rtlToggle.addEventListener(
            "click",
            function(){

                const currentDirection =
                    document.documentElement.dir ||
                    "ltr";


                const nextDirection =
                    currentDirection === "rtl"
                        ? "ltr"
                        : "rtl";


                applyDirection(
                    nextDirection
                );

            }
        );

    }


    /* =========================================================
       PASSWORD VISIBILITY
    ========================================================= */

    document
        .querySelectorAll(
            ".fb-password-toggle"
        )
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    const input =
                        document.getElementById(
                            button.dataset.password
                        );


                    if(!input){

                        return;

                    }


                    const isPassword =
                        input.type ===
                        "password";


                    input.type =
                        isPassword
                            ? "text"
                            : "password";


                    button.innerHTML =
                        isPassword

                            ? '<i data-lucide="eye-off"></i>'

                            : '<i data-lucide="eye"></i>';


                    button.setAttribute(
                        "aria-label",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );


                    if(window.lucide){

                        lucide.createIcons();

                    }

                }
            );

        });


    /* =========================================================
       SIGNUP FORM
    ========================================================= */

    const signupForm =
        document.getElementById(
            "signupForm"
        );


    if(signupForm){

        signupForm.addEventListener(
            "submit",
            function(event){

                event.preventDefault();


                const firstName =
                    document.getElementById(
                        "firstName"
                    ).value.trim();


                const lastName =
                    document.getElementById(
                        "lastName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "signupEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "signupPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                const terms =
                    document.getElementById(
                        "terms"
                    ).checked;


                /* -----------------------------------------
                   REQUIRED FIELDS
                ----------------------------------------- */

                if(
                    !firstName ||
                    !lastName ||
                    !email ||
                    !password ||
                    !confirmPassword
                ){

                    alert(
                        "Please complete all required fields."
                    );

                    return;

                }


                /* -----------------------------------------
                   PASSWORD MATCH
                ----------------------------------------- */

                if(
                    password !==
                    confirmPassword
                ){

                    alert(
                        "Passwords do not match."
                    );

                    return;

                }


                /* -----------------------------------------
                   TERMS
                ----------------------------------------- */

                if(!terms){

                    alert(
                        "Please accept the Terms and Privacy Policy."
                    );

                    return;

                }


                /* -----------------------------------------
                   DEMO USER DATA

                   Replace with your real API/backend
                   authentication later.
                ----------------------------------------- */

                localStorage.setItem(
                    "fundbloom-signup-name",
                    firstName +
                    " " +
                    lastName
                );


                localStorage.setItem(
                    "fundbloom-signup-email",
                    email
                );


                /* -----------------------------------------
                   GO TO LOGIN
                ----------------------------------------- */

                window.location.href =
                    "login.html";

            }
        );

    }


    /* =========================================================
       SOCIAL AUTH
    ========================================================= */

    document
        .querySelectorAll(
            ".fb-social-btn"
        )
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    /*
                     * Connect Google / Apple OAuth
                     * here when backend authentication
                     * is available.
                     */

                    console.log(
                        "Social authentication selected."
                    );

                }
            );

        });


    /* =========================================================
       CROSS-PAGE SETTINGS SYNC
    ========================================================= */

    window.addEventListener(
        "storage",
        function(event){


            if(
                event.key ===
                THEME_KEY
            ){

                applyTheme(
                    event.newValue ||
                    "light"
                );

            }


            if(
                event.key ===
                DIRECTION_KEY
            ){

                applyDirection(
                    event.newValue ||
                    "ltr"
                );

            }

        }
    );


    /* =========================================================
       FINAL ICON INITIALIZATION
    ========================================================= */

    if(window.lucide){

        lucide.createIcons();

    }


})();

</script>


</body>

</html>
